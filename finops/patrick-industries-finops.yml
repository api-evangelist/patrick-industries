  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Patrick Industries, Inc.
serviceCategory: Manufacturing
billingModel:
  pricingCategory: Purchase Order
  billingFrequency: Per Shipment / Net Terms
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Patrick Industries Components
  ServiceCategory: Manufacturing
  ProviderName: Patrick Industries
  PublisherName: Patrick Industries, Inc.
  InvoiceIssuerName: Patrick Industries, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: parts_shipped
    description: Components / SKUs shipped to OEM customer
    unit: unit
    aggregation: sum
    dimensions:
      - sku
      - customer
      - market
  - name: po_value
    description: Purchase-order line value
    unit: USD
    aggregation: sum
    dimensions:
      - customer
      - po
principles:
  - name: Visibility
    description: Visibility comes from customer ERP / EDI receipts; no Patrick-published consumer
      API.
  - name: Allocation
    description: Allocate by SKU, customer, and end market (RV / Marine / Powersports / Housing).
  - name: Optimization
    description: Optimization is on the OEM side via vendor consolidation, lead-time planning,
      and SKU rationalization.
  - name: Accountability
    description: OEM procurement owner accountable for spend; supplier scorecard reviews quarterly.
maintainers:
